# Deploys the multiplayer Worker (server/) to Cloudflare when the repository has an API token.
name: Deploy multiplayer Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Report missing Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Skipping the Worker deploy because the CLOUDFLARE_API_TOKEN secret is not set."
      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Run tests
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy:server
